name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - releases/**

jobs:
  validate:
    name: Validate LogGYM
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: ci-api-key
      VITE_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: ci-project
      VITE_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      VITE_FIREBASE_APP_ID: 1:1234567890:web:ci
      VITE_FIREBASE_MEASUREMENT_ID: G-CI000000
      VITE_FIREBASE_USE_EMULATORS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Typecheck mobile/shared
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: Lint mobile/shared
        run: npm run lint

      - name: Lint web
        run: npm --prefix web run lint

      - name: Build web
        run: npm --prefix web run build
